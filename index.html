<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헤어원네스트 상담 카드</title>
<!-- 아이콘: 핸드폰 즐겨찾기·홈 화면에 쓰인다. 다른 그림으로 바꾸려면 icons/ 안 다른 이름으로 세 줄을 고친다 -->
<link rel="icon" href="icons/scissors.svg" type="image/svg+xml">
<link rel="icon" href="icons/scissors.png" sizes="180x180" type="image/png">
<link rel="apple-touch-icon" href="icons/scissors.png">
<meta name="apple-mobile-web-app-title" content="상담 카드">
<meta name="theme-color" content="#f6ebdf">
<style>
  :root { --ink: #222; --muted: #777; --line: #ddd; --bg: #faf9f7; --accent: #8a5a3c; --accent-bg: #f3ebe4; --danger: #b3261e; --ok: #2e6b3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 16px; color: var(--ink); background: var(--bg); }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; cursor: pointer; }
  header small { color: var(--muted); flex: 1; }
  /* 세 칸: 왼쪽 메뉴 · 가운데 카드 · 오른쪽 오늘 명단(카드를 열어도 그대로 있다) */
  main { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 53px - 140px); }   /* 오른쪽 명단 칸은 10-13에 뺐다(타임테이블이 명단) */
  aside { background: #fff; border-right: 1px solid var(--line); padding: 16px; min-width: 0; }
  section { padding: 18px 28px; min-width: 0; }
  .remind .remind-head { margin: 2px 0 6px; }
  .remind .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
  .remind .tag.ok { color: var(--ok); border-color: #c9e2cd; }
  .remind .tag.todo { color: #fff; background: var(--danger); border-color: var(--danger); font-weight: 700; }
  .remind p { margin: 6px 0; }
  .remind h4 { margin: 10px 0 4px; font-size: 14px; }
  .remind-jobs { margin: 0; padding-left: 18px; font-size: 14px; }
  .remind-detail { font-size: 13px; }
  .remind-preview pre { white-space: pre-wrap; background: #fffaf6; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: inherit; font-size: 14px; margin: 6px 0; }
  .svc-mgr { margin: 8px 0 0; padding: 10px 12px; border: 1px solid var(--accent); border-radius: 10px; background: #fffaf6; }   /* 시술항목 관리(10-16) */
  .svc-mgr-head b { font-size: 15px; margin-right: 8px; }
  .svc-mgr-head small { color: var(--muted); font-size: 12px; }
  .svc-g { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .svc-g-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .svc-g-head .svc-g-name { font-weight: 700; width: 160px; max-width: 50%; padding: 6px 8px; }
  .svc-g-head small { color: var(--muted); flex: 1; }
  .svc-m-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 4px 12px; }
  .svc-m-row .svc-m-name { flex: 0 1 320px; min-width: 120px; padding: 7px 8px; }
  .svc-m-row .svc-m-price { width: 150px; padding: 7px 8px; text-align: right; }
  .svc-mgr select { padding: 7px 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 15px; color: var(--ink); }
  .svc-mgr .mv { padding: 4px 7px; font-size: 12px; line-height: 1; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }   /* ▲▼ 순서 */
  .svc-mgr .mv[disabled] { opacity: .3; cursor: default; }
  .svc-mgr .mv + .mv { margin-left: -2px; }
  .svc-mgr-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .svc-mgr-foot .msg { flex: 1; min-width: 120px; }
  .tl-add .svc-mgr-btn { white-space: nowrap; }
  .card-empty { color: var(--muted); padding: 30px 12px; line-height: 1.7; }
  /* 카드 맨 위: [오늘] [지난 방문 N건] 탭 */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 0 12px; }
  .tabs button { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 8px 12px; font-size: 14px; font-weight: 600; margin-bottom: -1px; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  /* [↑ 타임테이블]은 핸드폰에서만. PC는 타임테이블이 늘 위에 있다 */
  .to-today, .to-today-row { display: none; }
  /* 첫 줄: 이름 · 전화번호 · 소개인 · 주기 · [고치기] */
  .head-line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 0 0 10px; }
  .head-line .name { font-size: 24px; font-weight: 700; }
  .head-line .phone { font-size: 15px; }
  .head-line .ref { font-size: 14px; color: var(--muted); }
  /* 가족 (10-07): 이름 줄의 가족 이름, 고치기 안 가족 칸, 정액권 상자의 "함께" */
  .head-line .family { font-size: 14px; color: var(--accent); font-weight: 600; }
  .head-line .family .link { font-weight: 600; }
  .family-edit { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; margin: 6px 0 2px; }
  .family-edit .row { gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .family-edit small { color: var(--muted); }
  .family-edit #family-q { margin-top: 6px; }
  .family-edit .hits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .fam-names { font-size: 13px; color: var(--accent); }
  .fam-names.muted, .muted { color: var(--muted); }
  .pass-row .who { font-size: 12px; color: var(--accent); font-weight: 600; white-space: nowrap; }
  .head-line .cycle { margin-left: auto; font-size: 14px; white-space: nowrap; }
  .rec { color: var(--accent); font-weight: 600; }             /* 원장이 권한 방문 주기와 다음 예약 즈음 */
  .visit .field b .due { font-weight: 500; margin-left: 6px; color: var(--accent); }
  /* 그 밑: 기억할 것 한 줄(remember)과 지난번 시술 한 줄 — .memo는 정액권 내역 줄이 쓴다 */
  .remember { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; margin: 0 0 14px; }
  .remember .line { display: flex; gap: 12px; align-items: baseline; padding: 6px 0; }
  .remember .line + .line { border-top: 1px dotted var(--line); }
  .remember .k { flex: 0 0 48px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .remember .v { flex: 1; font-size: 15px; line-height: 1.5; white-space: pre-wrap; min-width: 0; }
  .remember .v i { color: var(--muted); }
  .remember .v .kinds-inline { margin: 0 6px 0 0; vertical-align: middle; }
  .remember .line > button { flex: 0 0 auto; }
  .remember details summary { font-size: 13px; margin: 4px 0 2px; }
  input, textarea, button { font: inherit; }
  input[type=text], textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  /* 방문 날짜: 기본은 오늘. 못 적고 지나간 날 것은 여기서 그날로 바꾼다 */
  input[type=date] { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: inherit; }
  .date-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
  .date-row small { color: var(--muted); }
  textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
  button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  button.secondary { background: #fff; color: var(--accent); }
  button.link { background: none; border: none; color: var(--accent); padding: 0; text-decoration: underline; font-size: 14px; }
  button.small { padding: 5px 10px; font-size: 14px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .row > button { flex: 0 0 auto; }
  .list { list-style: none; margin: 12px 0 0; padding: 0; }
  .list li { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .list li:hover { background: var(--accent-bg); }
  .list li.active { background: var(--accent-bg); font-weight: 600; }
  .list li small { color: var(--muted); }
  .empty { color: var(--muted); padding: 12px; }
  .card-title { margin: 0 0 4px; font-size: 22px; display: flex; align-items: baseline; gap: 10px; }
  .card-title small { font-size: 14px; color: var(--muted); font-weight: normal; }
  .identity { display: grid; grid-template-columns: 1fr 1fr 1fr auto auto auto auto; gap: 8px; align-items: end; margin: 8px 0 4px; }
  /* 사진: 방문 기록마다 한 줄. 96px 네모, 누르면 크게 */
  .photos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .photos .photo { position: relative; margin: 0; width: 96px; height: 96px; border-radius: 8px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
  .photos .photo img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }
  .photos .photo button.link.danger { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; line-height: 20px; padding: 0; border-radius: 50%; background: rgba(255,255,255,.9); text-decoration: none; font-size: 15px; text-align: center; }
  .photos .photo-add { display: inline-flex; align-items: center; justify-content: center; text-align: center; width: 96px; height: 96px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 14px; line-height: 1.3; cursor: pointer; background: #fff; }
  .photos .photo-add:hover { background: var(--accent-bg); }
  .photos .msg { flex-basis: 100%; margin: 0; min-height: 0; }
  .form-photos { margin: 12px 0 0; }
  .form-photos .photo-add small { display: block; font-size: 11px; color: var(--muted); }
  .photo-pointer { margin: 6px 0 0; text-align: right; }
  .photo-pointer .link { font-size: 13px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  .lightbox img { max-width: 96vw; max-height: 96vh; border-radius: 6px; }
  .referrer { color: var(--muted); font-size: 14px; margin: -2px 0 8px; }
  .profile { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0 20px; }
  .profile .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .profile .item b { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .profile .item p { margin: 0; white-space: pre-wrap; line-height: 1.5; }
  .card-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .col-right { border-left: 1px solid var(--line); padding-left: 24px; position: sticky; top: 12px; max-height: calc(100vh - 80px); overflow-y: auto; }
  @media (max-width: 1000px) { .card-split { grid-template-columns: 1fr; } .col-right { border-left: 0; padding-left: 0; position: static; max-height: none; } }
  .last-visit { background: var(--accent-bg); border-radius: 10px; padding: 10px 14px; margin: 6px 0 14px; }
  .last-visit b { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent); font-weight: 600; }
  .last-visit b small { color: var(--muted); font-weight: normal; }
  .last-visit p { margin: 4px 0 0; white-space: pre-wrap; line-height: 1.5; font-size: 16px; }
  .last-visit p.next { color: var(--muted); font-size: 14px; }
  .last-visit.empty-last { color: var(--muted); font-size: 14px; background: var(--bg); border: 1px dashed var(--line); }
  .next-big { background: var(--accent-bg); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; }
  .next-big b { display: block; font-size: 13px; color: var(--accent); margin-bottom: 4px; }
  .next-big p { margin: 0; white-space: pre-wrap; line-height: 1.5; font-size: 17px; }
  .visit { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .visit .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .visit .field b { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 8px 0 2px; }
  .visit .field p { margin: 0; white-space: pre-wrap; line-height: 1.6; }
  /* 시술 내용은 보여줄 때만 항목으로 나눈다 (저장은 말한 그대로) */
  .visit .field ul.lines { margin: 2px 0 0; padding-left: 18px; line-height: 1.7; }
  .visit .field ul.lines li { margin: 0; }
  .visit .field ul.lines li.num { list-style: none; margin-left: -14px; }   /* 번호가 있으면 점을 안 찍는다 */
  /* 이름표가 있으면 왼쪽 이름표 · 오른쪽 내용 */
  .visit .field .chart { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin-top: 4px; align-items: baseline; }
  .visit .field .chart .lb { font-size: 12px; font-weight: 700; color: var(--muted); }
  .visit .field .chart .tx { line-height: 1.6; }
  .remember .v b { font-size: 12px; font-weight: 700; color: var(--muted); }
  /* 글에 제목·번호·표시가 이미 있으면 그 구조대로: 제목은 굵게, 항목은 점 하나, 단은 들여쓰기 */
  .visit .field .outline { margin-top: 4px; line-height: 1.6; }
  .visit .field .outline .h { font-weight: 700; margin-top: 8px; }
  .visit .field .outline .h:first-child { margin-top: 2px; }
  .visit .field .outline .s { font-weight: 600; margin-top: 4px; }
  .visit .field .outline .i { display: flex; gap: 7px; }
  .visit .field .outline .i::before { content: '•'; color: var(--muted); flex: 0 0 auto; }
  .visit .field .outline .i.num::before { content: none; }
  /* .visit .field b는 칸 제목용(블록·작은 글씨)이라 항목 안의 이름은 따로 되돌린다 */
  .visit .field .outline .i b { display: inline; font-size: inherit; color: inherit; font-weight: 700; margin: 0 8px 0 0; white-space: nowrap; }
  .visit .field .outline .l1 { margin-left: 16px; }
  .visit .field .outline .l2 { margin-left: 32px; }
  .visit .field .outline .l3 { margin-left: 48px; }
  /* 적는 칸 밑 "저장하면 이렇게 나뉩니다": 왼쪽 이름표, 오른쪽 내용. 나뉠 게 없으면 자리도 없다 */
  .split-preview { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 13px; line-height: 1.5; margin: 4px 0 0; color: var(--muted); align-items: baseline; }
  .split-preview:empty { display: none; }
  .split-preview .lb { font-weight: 700; }
  .split-preview .tx { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .split-preview .tx.unsaid { color: var(--muted); }          /* 아직 안 말한 항목 (.empty는 빈 목록 안내가 쓰는 이름이라 피한다) */
  #visit-done { min-height: 172px; }                           /* 회색 안내 여섯 줄이 다 보이게 */
  .msg { min-height: 22px; font-size: 14px; margin-top: 8px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .msg.draft { color: var(--muted); }
  .msg.draft .link { font-size: 13px; }
  details summary { cursor: pointer; color: var(--muted); margin: 10px 0 6px; }
  .newform { display: grid; gap: 8px; }
  h3 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 24px 0 10px; }
  /* 오른쪽 명단 한 줄: 순번 · 시간 · 이름/주기 · 상태 (좁은 칸에 맞춰 짧게) */
  /* 오늘 타임테이블 (10-13): 가로 30분 칸, 시술 길이만큼 폭, 겹치면 줄 추가 */
  .timeline { background: #fff; border-bottom: 1px solid var(--line); padding: 8px 14px 6px; }   /* 머리글 바로 밑, 세 칸 위를 가로로 다 쓴다 */
  .tl-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 6px; }
  .tl-head b { font-size: 16px; white-space: nowrap; }
  .tl-head { flex-wrap: wrap; align-items: center; }
  .tl-head small { color: var(--muted); }
  .tl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tl-grid { display: grid; gap: 3px 0; min-width: 960px; position: relative; }
  .tl-slot { grid-row: 1; font-size: 12px; color: var(--muted); border-left: 1px solid var(--line); padding: 2px 0 0 4px; white-space: nowrap; }
  .tl-slot.hour { font-weight: 700; color: var(--ink); }
  .tl-slot.half { font-size: 10px; }
  .tl-cell { border-left: 1px dashed #eee; cursor: pointer; }
  .tl-cell.hour { border-left-color: var(--line); border-left-style: solid; }
  .tl-cell:hover { background: #f7f1ea; }
  .tl-head .ok { color: var(--ok); font-weight: 600; }
  .tl-head .bad, .tl-untimed .bad, .tl-pending .bad { color: var(--danger); font-weight: 600; }
  .tl-head input[type=date] { padding: 4px 6px; width: auto; font-size: 13px; }
  .tl-head button.small { padding: 4px 8px; }
  .tl-block { margin: 2px 2px 2px 1px; border-radius: 7px; padding: 4px 8px; background: var(--accent-bg); border: 1px solid #e4d5c8; cursor: pointer; overflow: hidden; min-width: 0; z-index: 1; display: flex; flex-direction: column; justify-content: center; line-height: 1.25; }
  .tl-block b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-block small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-block.done { background: #e4f1e6; border-color: #c9e2cd; }
  .tl-block.done b { color: var(--ok); }
  .tl-block.todo { background: #fbe9e7; border-color: #f0c9c4; }
  .tl-block.todo b { color: var(--danger); }
  .tl-block.booked { background: #e8eef8; border-color: #c8d5ea; }
  .tl-block.booked b { color: #2f5596; }
  .tl-block .nophone, .tl-untimed .nophone { font-style: normal; font-weight: 600; color: var(--danger); }
  .tl-untimed .nophone { font-size: 10px; margin-left: 4px; }
  .tl-block .nosvc { font-style: normal; font-weight: 600; color: #a0622d; }
  .tl-sel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 6px 0 0; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 10px; background: var(--accent-bg); }
  .tl-sel small { color: var(--muted); }
  .tl-sel label { display: inline-flex; align-items: center; gap: 4px; margin: 0; font-size: 14px; }
  .tl-sel select { padding: 6px 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 15px; }
  .tl-sel .small-note { font-size: 13px; }
  .tl-block.no-phone { border: 1px dashed var(--danger); }
  .tl-tag { font-size: 11px; font-weight: 600; color: #2f5596; background: #e8eef8; border-radius: 6px; padding: 1px 6px; vertical-align: middle; }
  .tl-block.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .tl-block:hover { filter: brightness(.97); }
  .tl-empty { color: var(--muted); font-size: 13px; padding: 12px 6px; pointer-events: none; z-index: 1; }   /* 빈 날 안내 글이 칸을 덮어 클릭이 막혔다(10-14 원장) — 글은 보이고 클릭은 밑의 칸으로 */
  .tl-untimed { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .tl-untimed button { padding: 2px 6px; }
  .tl-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .tl-add .at { flex: 0 0 104px; }
  .tl-add .svc { flex: 0 0 190px; }
  .tl-add .svc.grp { flex: 0 0 130px; }
  .tl-add .svc[hidden] { display: none; }

  /* V3 메인(10-02 원장): 왼쪽 메뉴 단추 넷(예약관리·결산·재고관리·고객 채팅), 가운데 대시보드와 늘 펼쳐 둔 고객 등록 칸 */
